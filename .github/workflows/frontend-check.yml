name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"
  push:
    branches:
      - feature/platform-expansion-plan
      - develop
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Generate temporary lockfile for dependency audit
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload resolved frontend lockfile for reproducible setup
        uses: actions/upload-artifact@v6
        with:
          name: myschool-frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Report resolved dependencies and audit runtime packages
        working-directory: frontend
        run: |
          npm ls --depth=0
          npm audit --omit=dev --audit-level=high
      - name: Run access-control unit tests
        working-directory: frontend
        run: npm test
      - name: Build production assets
        working-directory: frontend
        run: npm run build
