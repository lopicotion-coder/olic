name: My School Supabase encrypted backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        id: validate
        shell: bash
        run: |
          required=(SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY AGE_RECIPIENT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::notice::Backup skipped. Configure Actions secrets: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.validate.outputs.configured == 'true'
        with:
          node-version: "22"

      - uses: supabase/setup-cli@v1
        if: steps.validate.outputs.configured == 'true'
        with:
          version: latest

      - name: Install backup dependencies
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --no-save --package-lock=false @supabase/supabase-js@2

      - name: Dump PostgreSQL and export Storage
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/myschool-backup"
          mkdir -p "$work"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$work/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$work/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "$work/data.sql" --use-copy --data-only
          node scripts/backup/export-storage.mjs "$work/storage"
          printf '{"created_at":"%s","git_sha":"%s","format":"supabase-db+storage","encrypted":true}\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > "$work/backup-manifest.json"
          tar -C "$work" -czf "$RUNNER_TEMP/myschool-full-backup.tar.gz" .

      - name: Encrypt archive
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/myschool-full-backup.tar.gz.age" "$RUNNER_TEMP/myschool-full-backup.tar.gz"
          sha256sum "$RUNNER_TEMP/myschool-full-backup.tar.gz.age" > "$RUNNER_TEMP/myschool-full-backup.tar.gz.age.sha256"
          rm -f "$RUNNER_TEMP/myschool-full-backup.tar.gz"

      - name: Upload encrypted archive to private Cloudflare R2
        if: steps.validate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          stamp="$(date -u +%Y/%m/%d/%H%M%S)"
          aws s3 cp "$RUNNER_TEMP/myschool-full-backup.tar.gz.age" "s3://${R2_BUCKET}/myschool/${stamp}/full-backup.tar.gz.age" --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "$RUNNER_TEMP/myschool-full-backup.tar.gz.age.sha256" "s3://${R2_BUCKET}/myschool/${stamp}/full-backup.tar.gz.age.sha256" --endpoint-url "$endpoint" --only-show-errors
