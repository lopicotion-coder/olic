<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My School — UI Prototype v4.1 (Phase 9)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f6f3;--surface:#fff;--surface-2:#f7faf8;--line:#e1e8e3;--text:#183029;--muted:#6c7d76;--brand:#174b43;--brand-2:#23695c;--brand-soft:#e7f2ee;--accent:#d8a65a;--red:#b94b42;--green:#317653;--blue:#376a8e;--shadow:0 8px 24px rgba(20,40,34,.06);--radius:16px}
:root[data-theme="dark"]{--bg:#111a18;--surface:#1b2824;--surface-2:#20302b;--line:#31433c;--text:#e5eee9;--muted:#9aaca3;--brand:#7eb7a3;--brand-2:#9ac8b7;--brand-soft:#243b33;--accent:#d9b16e;--red:#f28b81;--green:#89cba3;--blue:#8cb8d5;--shadow:0 8px 24px rgba(0,0,0,.2)}
:root[data-theme="black"]{--bg:#000;--surface:#070707;--surface-2:#121212;--line:#2a2a2a;--text:#f4f4f4;--muted:#a3a3a3;--brand:#9bcdbd;--brand-2:#b4dfd0;--brand-soft:#152521;--accent:#e6bd7b;--red:#ff9188;--green:#8fd0a7;--blue:#91c5e8;--shadow:0 8px 24px rgba(0,0,0,.38)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}
.sidebar{background:var(--surface);border-left:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.mark{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.role-box,.card,.topbar,.pill,.btn,.field input,.field textarea,.field select,.nav-btn,.theme-choice,.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.role-box{padding:14px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nav-group{margin-top:12px}.nav-title{font-size:12px;color:var(--muted);margin:10px 0 6px}.nav-btn{width:100%;padding:10px 12px;margin:4px 0;text-align:right;display:flex;align-items:center;gap:10px;background:transparent}.nav-btn.active,.nav-btn:hover{background:var(--brand-soft);border-color:transparent}
.nav-ico,.avatar,.avatar-sm{display:grid;place-items:center;border-radius:50%}.nav-ico{width:28px;height:28px;background:var(--brand-soft);color:var(--brand)}
.main{padding:18px 18px 26px;overflow:auto}.topbar{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.crumb{font-size:11px;color:var(--muted);font-weight:700}.topbar h1,.page-head h2{margin:4px 0 0}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avatar{width:40px;height:40px;background:var(--brand);color:#fff;font-weight:800}.avatar-sm{width:32px;height:32px;background:var(--brand-soft);color:var(--brand);font-weight:800}
.content{max-width:1320px}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.stat,.theme-choice,.pill,.btn{padding:14px}.card{margin-bottom:14px}.card h3{margin:0 0 8px}.tiny,.muted{color:var(--muted)}.tiny{font-size:11px}.muted{font-size:12px}
.page-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:12px}.page-head p{margin:4px 0 0;color:var(--muted)}
.stat strong{display:block;font-size:22px}.bar{display:grid;grid-template-columns:1fr 120px 48px;gap:8px;align-items:center}.bar-track{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.bar-track span{display:block;height:100%;background:var(--brand)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}.table th{font-size:12px;color:var(--muted)}
.notice{padding:14px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface-2);margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}.chip.ok{background:#eaf5ee;color:#317653}.chip.warn{background:#fff3d9;color:#8b6229}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--brand);color:#fff;border-color:transparent}.btn.soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}.btn.small{padding:8px 10px;font-size:12px}
.stack{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.select,.field input,.field textarea,.field select{width:100%;padding:11px 12px;color:var(--text)}
.field{display:grid;gap:6px}.field textarea{min-height:96px;resize:vertical}
.settings-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}.settings-nav{display:grid;gap:8px}.settings-nav button{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:right}.settings-nav button.active{background:var(--brand-soft);border-color:transparent}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.theme-choice{display:grid;gap:8px;text-align:right}.theme-choice.selected{outline:2px solid var(--brand-2)}.theme-preview{height:86px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:10px;display:grid;gap:8px}.theme-preview.dark{background:#1b2824}.theme-preview.black{background:#000}.theme-preview .line{height:8px;background:currentColor;opacity:.12;border-radius:999px}.theme-preview .card{height:34px;border-radius:12px;background:currentColor;opacity:.08;border:0;box-shadow:none;padding:0}
.chat{display:grid;gap:10px;max-height:420px;overflow:auto}.bubble{padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}.bubble.mine{background:var(--brand-soft)}.bubble small{display:block;margin-top:4px;color:var(--muted)}
.release-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
.footer{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}.settings-grid,.release-grid,.two,.three{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const roles={owner:'مالك المنصة',admin:'إدارة المدرسة',teacher:'المدرس',attendance:'موظف الحضور',supervisor:'مشرف الإشراف',parent:'ولي الأمر',student:'الطالب'};
const menus={
 owner:[['عام',[['dashboard','نظرة عامة','⌂'],['tenants','المدارس والعملاء','▦'],['users','المستخدمون','♙'],['billing','الاشتراكات','▤'],['platformOps','عمليات المنصة','⚙'],['production','Phase 9 / الإطلاق','⬚'],['audit','سجل التدقيق','≡'],['settings','الإعدادات','◉']]]],
 admin:[['المدرسة',[['dashboard','نظرة عامة','⌂'],['students','الطلاب','♙'],['enrollment','طلبات التسجيل','▤'],['staff','المدرسون والموظفون','♧'],['academics','الهيكل الدراسي','▦'],['timetable','الجدول','▦'],['attendance','الحضور','◷'],['grades','الدرجات','▤'],['assignments','الواجبات','✓'],['exams','الامتحانات','▥'],['finance','المصروفات','₤'],['imports','الاستيراد','⇧'],['documents','المستندات','▧'],['messages','التواصل','▤'],['reports','التقارير','▥'],['memberships','الصلاحيات','♙'],['settings','الإعدادات','◉']]]],
 teacher:[['التعليم',[['dashboard','نظرة عامة','⌂'],['myclasses','فصولي وطلابي','♙'],['timetable','الجدول','▦'],['grades','الدرجات','▤'],['assignments','الواجبات','✓'],['messages','الرسائل','▤'],['reports','تقارير الطلاب','▥'],['settings','الإعدادات','◉']]]],
 attendance:[['الحضور',[['dashboard','ملخص العمل','⌂'],['attendance','تسجيل الحضور','◷'],['students','قوائم الطلاب','♙'],['messages','التواصل','▤'],['settings','الإعدادات','◉']]]],
 supervisor:[['الإشراف',[['dashboard','نظرة عامة','⌂'],['attendance','الحضور','◷'],['behavior','التقارير السلوكية','▤'],['reports','الإحصائيات','▥'],['students','ملفات الطلاب','♙'],['messages','التواصل','▤'],['settings','الإعدادات','◉']]]],
 parent:[['الأسرة',[['dashboard','الرئيسية','⌂'],['children','أبنائي','♙'],['grades','الدرجات','▤'],['attendance','الحضور','◷'],['timetable','الجدول','▦'],['assignments','الواجبات','✓'],['messages','الرسائل','▤'],['news','الأخبار','▧'],['fees','الرسوم','₤'],['notifications','الإشعارات','♢'],['settings','الإعدادات','◉']]]],
 student:[['مساحتي',[['dashboard','الرئيسية','⌂'],['timetable','جدولي','▦'],['grades','درجاتي','▤'],['assignments','واجباتي','✓'],['messages','الرسائل','▤'],['news','الأخبار','▧'],['achievements','إنجازاتي','◇'],['notifications','الإشعارات','♢'],['settings','الإعدادات','◉']]]]
};
const data={
 students:[
  {id:'S-1204',name:'أحمد محمد علي',grade:'الصف الخامس',className:'5A',parent:'منى أحمد',average:88,attendance:96,points:1240,level:7,reports:['ملاحظة سلوكية في نشاط جماعي'],marks:[['الرياضيات',18,20],['العلوم',44,50],['العربية',27,30]]},
  {id:'S-1205',name:'سارة محمود حسن',grade:'الصف الثاني الإعدادي',className:'2B',parent:'منى أحمد',average:94,attendance:99,points:1760,level:9,reports:['لا توجد تقارير سلبية'],marks:[['الرياضيات',19,20],['العلوم',48,50],['العربية',29,30]]}
 ],
 news:[
  {title:'موعد اختبارات منتصف الفصل',audience:'الطلاب وأولياء الأمور',date:'15 نوفمبر 2026'},
  {title:'اجتماع أولياء الأمور',audience:'أولياء الأمور',date:'13 نوفمبر 2026'},
  {title:'مسابقة العلوم المدرسية',audience:'الطلاب',date:'11 نوفمبر 2026'}
 ],
 chats:[
  {title:'أ. سارة — رياضيات',subtitle:'أحمد محمد علي • 5A',messages:[['الطالب','أستاذة هل يمكن مراجعة السؤال الثاني؟','09:45 ص'],['المدرس','أكيد، بعد الحصة مباشرة.','09:47 ص']]},
  {title:'مجموعة 5A',subtitle:'18 طالبًا',messages:[['سارة','هل في مراجعة اليوم؟','08:50 ص'],['أحمد','نعم الساعة 3.','08:57 ص']]}
 ],
 release:[['الإقفال',92,'مراجعة RLS والعزل بين المدارس'],['البناء',89,'build وtypecheck'],['النسخ',76,'نسخ واستعادة'],['المراقبة',81,'سجلات وتنبيهات'],['الموبايل',58,'تغليف Capacitor / PWA']]
};
let state={role:'admin',page:'dashboard',theme:'light',settingsTab:'appearance',selectedStudent:data.students[0].id,selectedChild:data.students[0].id,showLogin:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const initials=s=>s.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
function applyTheme(){document.documentElement.dataset.theme=state.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):state.theme;}
function pageTitle(){if(state.page==='search')return'البحث الموحد';if(state.page==='ai')return state.role==='owner'?'استخدام الذكاء الاصطناعي':'المساعد الذكي';return (menus[state.role]||[]).flatMap(g=>g[1]).find(x=>x[0]===state.page)?.[1]||'My School'}
function nav(){const head=`<div class="nav-group"><div class="nav-title">الوصول السريع</div><button class="nav-btn ${state.page==='search'?'active':''}" data-action="navigate" data-page="search"><span class="nav-ico">⌕</span>البحث</button>${['owner','admin','teacher','parent','student'].includes(state.role)?`<button class="nav-btn ${state.page==='ai'?'active':''}" data-action="navigate" data-page="ai"><span class="nav-ico">✧</span>${state.role==='owner'?'الذكاء الاصطناعي':'المساعد الذكي'}</button>`:''}</div>`;return head+menus[state.role].map(([group,items])=>`<div class="nav-group"><div class="nav-title">${group}</div>${items.map(([k,l,i])=>`<button class="nav-btn ${state.page===k?'active':''}" data-action="navigate" data-page="${k}"><span class="nav-ico">${i}</span>${l}</button>`).join('')}</div>`).join('')}
const m=(label,val,sub='')=>`<div class="stat"><div class="label">${label}</div><strong>${val}</strong><div class="tiny">${sub}</div></div>`;
const bar=(label,val)=>`<div class="bar"><div>${label}</div><div class="bar-track"><span style="width:${val}%"></span></div><b>${val}%</b></div>`;
function head(){return `<header class="topbar"><div><div class="crumb">MY SCHOOL / ${roles[state.role].toUpperCase()}</div><h1>${pageTitle()}</h1></div><div class="top-actions"><button class="btn small" data-action="navigate" data-page="notifications">الإشعارات</button><button class="btn small" data-action="navigate" data-page="settings">الإعدادات</button><button class="btn small" data-action="logout">خروج</button><div class="avatar">${initials(roles[state.role])}</div></div></header>`}
function shell(){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">MS</div><div><b>My School</b><div class="tiny">منصة إدارة وتشغيل المدرسة</div></div></div><div class="role-box"><div class="label">معاينة الأدوار</div><select id="roleSelect" class="select">${Object.entries(roles).map(([k,v])=>`<option value="${k}" ${state.role===k?'selected':''}>${v}</option>`).join('')}</select></div>${nav()}</aside><main class="main">${head()}<section class="content">${page()}</section><div class="footer">My School • Demo UI v4.1 • بيانات افتراضية فقط • Phase 9 مضافة في هذا الإصدار</div></main></div>`}
function activeStudent(){return data.students.find(s=>s.id===state.selectedStudent)||data.students[0]}
function activeChild(){return data.students.find(s=>s.id===state.selectedChild)||data.students[0]}

function staff(){return `${pageHead('المدرسون والموظفون','إدارة الحسابات الوظيفية وإسناد الأدوار والفصول.')}
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الدور</th><th>الفصول المسندة</th><th>الحالة</th></tr></thead><tbody><tr><td>سارة محمد</td><td>مدرسة رياضيات</td><td>5A، 5B</td><td><span class="chip ok">نشط</span></td></tr><tr><td>محمد أحمد</td><td>مدرس علوم</td><td>5A، 6A</td><td><span class="chip ok">نشط</span></td></tr><tr><td>عمر خالد</td><td>موظف حضور</td><td>المرحلة الابتدائية</td><td><span class="chip">نشط</span></td></tr></tbody></table></div></div>`}
function academics(){return `${pageHead('الهيكل الدراسي','إعداد العام الدراسي والمراحل والصفوف والفصول والمواد.')}
<div class="grid three">${m('العام الدراسي','2026/2027','نشط')}${m('المراحل','3','ابتدائي، إعدادي، ثانوي')}${m('الفصول','24','في المدرسة')}</div><div class="grid two"><section class="card"><h3>المراحل والصفوف</h3><div class="item"><span>المرحلة الابتدائية</span><b>الصف 1 – 6</b></div><div class="item"><span>المرحلة الإعدادية</span><b>الصف 1 – 3</b></div><div class="item"><span>المرحلة الثانوية</span><b>الصف 1 – 3</b></div></section><section class="card"><h3>المواد الدراسية</h3><div class="stack">${['اللغة العربية','اللغة الإنجليزية','الرياضيات','العلوم','الدراسات الاجتماعية'].map(x=>`<div class="item"><span>${x}</span><span class="chip">مفعّلة</span></div>`).join('')}</div></section></div>`}
function exams(){return `${pageHead('الامتحانات','إدارة جلسات الامتحانات والجداول وقوائم الطلاب.')}
<div class="grid three">${m('جلسات قادمة','4','خلال الشهر الحالي')}${m('طلاب مسجلون','186','في الجلسات')}${m('تعارضات','0','بعد التحقق')}</div><div class="card"><h3>جدول الامتحانات</h3><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>المادة</th><th>الصف</th><th>الوقت</th><th>الحالة</th></tr></thead><tbody><tr><td>22 نوفمبر 2026</td><td>رياضيات</td><td>5A</td><td>09:00</td><td><span class="chip ok">مجدول</span></td></tr><tr><td>24 نوفمبر 2026</td><td>علوم</td><td>5A</td><td>09:00</td><td><span class="chip ok">مجدول</span></td></tr></tbody></table></div></div>`}
function finance(){return `${pageHead('المالية والمصروفات','متابعة الخطط والأقساط والمدفوعات والتحصيل.')}
<div class="grid three">${m('إجمالي المستحق','480,000 ج.م','للعام الحالي')}${m('تم تحصيله','356,000 ج.م','74% من المستحق')}${m('مدفوعات معلّقة','18','تحتاج مراجعة')}</div><div class="card"><h3>آخر المدفوعات</h3><div class="table-wrap"><table class="table"><thead><tr><th>الطالب</th><th>البند</th><th>المبلغ</th><th>الحالة</th></tr></thead><tbody><tr><td>أحمد محمد علي</td><td>القسط الأول</td><td>4,000 ج.م</td><td><span class="chip ok">مدفوع</span></td></tr><tr><td>سارة محمود حسن</td><td>رسوم الأنشطة</td><td>750 ج.م</td><td><span class="chip warn">معلّق</span></td></tr></tbody></table></div></div>`}
function imports(){return `${pageHead('استيراد البيانات','استيراد قوائم الطلاب والموظفين من ملفات CSV بعد المعاينة والتحقق.')}
<div class="card"><h3>استيراد ملف CSV</h3><div class="field"><label for="csvFile">اختر الملف</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><p class="muted">هذه محاكاة للواجهة فقط؛ لا يتم رفع الملف أو حفظه في أي خدمة.</p><button class="btn primary" type="button" data-action="toast" data-message="ميزة المعاينة متاحة في النسخة المتصلة بالـ Backend">معاينة البيانات</button></div><div class="notice">التدفق المقصود: رفع الملف ← مطابقة الأعمدة ← التحقق من الأخطاء والتكرار ← معاينة ← تأكيد الاستيراد.</div>`}
function documents(){return `${pageHead('المستندات','مركز مستندات الطلاب والمدرسة مع حالات المراجعة.')}
<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>المستند</th><th>الطالب</th><th>تاريخ الإضافة</th><th>الحالة</th></tr></thead><tbody><tr><td>شهادة الميلاد</td><td>أحمد محمد علي</td><td>10 نوفمبر 2026</td><td><span class="chip ok">تمت المراجعة</span></td></tr><tr><td>صورة شخصية</td><td>سارة محمود حسن</td><td>12 نوفمبر 2026</td><td><span class="chip warn">بانتظار المراجعة</span></td></tr></tbody></table></div></div>`}
function reports(){return `${pageHead('التقارير','تقارير الحضور والأداء والسلوك مع إمكانية مراجعة ملف الطالب.')}

function render(){applyTheme();try{$('#app').innerHTML=shell();}catch(error){console.error('My School demo render error:',error);$('#app').innerHTML=`<main style="max-width:900px;margin:40px auto;padding:24px;font-family:Tahoma,Arial,sans-serif;direction:rtl;background:#fff;color:#183029;border:1px solid #d9e3dc;border-radius:16px"><h1>تعذر عرض هذه الشاشة</h1><p>حدث خطأ أثناء بناء الواجهة. لم تعد الصفحة فارغة؛ يمكنك إعادة تحميل الديمو.</p><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:8px;background:#174b43;color:#fff;cursor:pointer">إعادة تحميل الديمو</button><pre style="white-space:pre-wrap;color:#8a3933">${String(error?.message||error)}</pre></main>`;}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const d=a.dataset; if(d.action==='navigate'){state.page=d.page;render()} else if(d.action==='set-theme'){state.theme=d.theme;render()} else if(d.action==='settings-tab'){state.settingsTab=d.tab;render()} else if(d.action==='select-student'){state.selectedStudent=d.id;render()} else if(d.action==='select-child'){state.selectedChild=d.id;render()} else if(d.action==='logout'){state.page='dashboard';state.role='student';render()} else if(d.action==='toast'){alert(d.message)}});
document.addEventListener('change',e=>{if(e.target.id==='roleSelect'){state.role=e.target.value;state.page='dashboard';render()}else if(e.target.id==='gradeChildSelect'){state.selectedChild=e.target.value;render()}});
if(matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?.('change',()=>{if(state.theme==='system')render()});}
render();
</script>
</body>
</html>
