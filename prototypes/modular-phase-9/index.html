<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My School — Modular Phase 9 Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;800&display=swap');
:root{--bg:#f4f6f3;--surface:#fff;--surface2:#f7faf8;--line:#e1e8e3;--text:#183029;--muted:#6c7d76;--brand:#174b43;--soft:#e7f2ee;--shadow:0 8px 24px rgba(20,40,34,.06);--r:16px}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--text)}*{box-sizing:border-box}button,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{background:var(--surface);border-left:1px solid var(--line);padding:18px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}.mark{width:44px;height:44px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}.box,.card,.top,.btn,.nav{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.box{padding:14px}.nav{width:100%;padding:10px 12px;margin:4px 0;background:transparent;text-align:right;display:flex;gap:10px;align-items:center}.nav.on,.nav:hover{background:var(--soft);border-color:transparent}.ico{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center}.main{padding:18px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin-bottom:16px}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.stat,.btn{padding:14px}.card{margin-bottom:14px}.stat strong{display:block;font-size:22px}.muted,.tiny{color:var(--muted)}.tiny{font-size:11px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}.chip{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px}.ok{background:#eaf5ee;color:#317653}.warn{background:#fff3d9;color:#8b6229}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px}.primary{background:var(--brand);color:#fff;border-color:transparent}.soft{background:var(--soft);color:var(--brand);border-color:transparent}.stack{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px;gap:12px}.head h2,.top h1{margin:4px 0 0}.foot{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:1100px){.app{grid-template-columns:1fr}.side{border-left:0;border-bottom:1px solid var(--line)}.two,.three,.four{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style>
</head>
<body><div id="app"></div>
<script>
const roles={admin:'إدارة المدرسة',teacher:'المدرس',supervisor:'مشرف',transport:'مدير النقل',attendant:'مشرفة الباص',driver:'السائق',parent:'ولي الأمر',student:'الطالب',owner:'مالك المنصة'};
const menus={admin:[['عام',[['dashboard','نظرة عامة','⌂'],['students','الطلاب','♙'],['attendance','الحضور','◷'],['grades','الدرجات','▤'],['transport','النقل','⇄'],['settings','الإعدادات','◉']]]],teacher:[['تعليم',[['dashboard','نظرة عامة','⌂'],['myclasses','فصولي','♙'],['assignments','الواجبات','✓'],['messages','الرسائل','▤'],['settings','الإعدادات','◉']]]],supervisor:[['إشراف',[['dashboard','نظرة عامة','⌂'],['behavior','التقارير السلوكية','▤'],['students','ملفات الطلاب','♙'],['settings','الإعدادات','◉']]]],transport:[['نقل',[['dashboard','نظرة عامة','⌂'],['routes','الرحلات','⇄'],['attendant','مشرفة الباص','◫'],['driver','السائق','◎'],['tracking','التتبع','⌖'],['settings','الإعدادات','◉']]]],attendant:[['باص',[['dashboard','نظرة عامة','⌂'],['attendant','قائمة الاستلام','◫'],['tracking','التتبع','⌖'],['settings','الإعدادات','◉']]]],driver:[['قيادة',[['dashboard','نظرة عامة','⌂'],['driver','المسار','◎'],['tracking','التتبع','⌖'],['settings','الإعدادات','◉']]]],parent:[['أسرة',[['dashboard','الرئيسية','⌂'],['children','أبنائي','♙'],['grades','الدرجات','▤'],['attendance','الحضور','◷'],['tracking','التتبع','⌖'],['device','الرقابة الأبوية','⛭'],['settings','الإعدادات','◉']]]],student:[['مساحتي',[['dashboard','الرئيسية','⌂'],['grades','درجاتي','▤'],['assignments','واجباتي','✓'],['tracking','التتبع','⌖'],['settings','الإعدادات','◉']]]],owner:[['منصة',[['dashboard','نظرة عامة','⌂'],['production','Phase 9','⬚'],['audit','التدقيق','≡'],['settings','الإعدادات','◉']]] ]};
const db={students:[{n:'أحمد محمد علي',c:'5A',avg:88,a:96,p:'منى أحمد',r:'ملاحظة سلوكية'},{n:'سارة محمود حسن',c:'2B',avg:94,a:99,p:'منى أحمد',r:'لا توجد تقارير'},{n:'يوسف خالد السيد',c:'1C',avg:81,a:92,p:'خالد السيد',r:'تأخر في واجب'}],routes:[{name:'خط المعادي',driver:'أحمد سعيد',attendant:'إيمان محمود',bus:'Microbus 12',students:18,status:'نشط'},{name:'خط الجيزة',driver:'محمد عادل',attendant:'ريم علي',bus:'Bus 07',students:11,status:'قيد التجهيز'}],pickup:[['أحمد محمد علي','شارع المدارس','06:52','استلمت'],['سارة محمود حسن','مدخل العمارة','06:58','بانتظار']]};
const state={role:'admin',page:'dashboard',theme:'light',child:0,route:0};
const $=s=>document.querySelector(s); const ic=s=>s.split(/\s+/).slice(0,2).map(x=>x[0]).join('');
const t=(k,v,s='')=>`<div class=stat><div class=tiny>${k}</div><strong>${v}</strong><div class=tiny>${s}</div></div>`; const b=(l,v)=>`<div class=item><span>${l}</span><b>${v}%</b></div>`;
function title(){return ({dashboard:'نظرة عامة',students:'الطلاب',attendance:'الحضور',grades:'الدرجات',transport:'النقل',myclasses:'فصولي',assignments:'الواجبات',messages:'الرسائل',behavior:'السلوك',routes:'الرحلات',attendant:'مشرفة الباص',driver:'السائق',tracking:'التتبع',children:'أبنائي',device:'الرقابة الأبوية',production:'Phase 9',audit:'التدقيق',settings:'الإعدادات'})[state.page]||'My School';}
function nav(){return (menus[state.role]||[]).map(([g,items])=>`<div class=box><div class=tiny>${g}</div>${items.map(([k,l,i])=>`<button class='nav ${state.page===k?'on':''}' data-a='nav' data-p='${k}'><span class=ico>${i}</span>${l}</button>`).join('')}</div>`).join('');}
function header(){return `<div class=top><div><div class=tiny>MY SCHOOL / ${roles[state.role]}</div><h1>${title()}</h1></div><div style='display:flex;gap:8px;align-items:center;flex-wrap:wrap'><button class='btn' data-a='nav' data-p='settings'>الإعدادات</button><button class='btn' data-a='nav' data-p='dashboard'>الصفحة الرئيسية</button><div class=mark>${ic(roles[state.role])}</div></div></div>`;}
function dashboard(){if(state.role==='owner')return `${head('إطلاق المنصة','إدارة المدارس والعملاء والاشتراكات',t('المدارس',18,'نشطة')+t('الاشتراكات',15,'مفعلة')+t('جاهزية Phase 9',84,'قيد الإقفال'))}<div class='grid two'><div class=card><h3>قائمة الإقفال</h3>${['صلاحيات RBAC','العزل بين المدارس','الموديولات','المراقبة','النسخ والاستعادة'].map(x=>`<div class=item><span>${x}</span><span class=chip ok>مراجعة</span></div>`).join('')}</div><div class=card><h3>الإجراءات</h3><div class=stack><button class='btn primary'>مراجعة البناء</button><button class='btn soft'>مراجعة النشر</button></div></div></div>`;
 if(state.role==='transport')return `${head('النقل المدرسي','مسارات الرحلات ومشرفة الباص والسائق',t('الخطوط',db.routes.length,'نشطة')+t('الطلاب',db.routes.reduce((a,b)=>a+b.students,0),'على الرحلات')+t('GPS','حي','مبدئي'))}<div class='grid two'><div class=card><h3>الرحلات</h3>${db.routes.map((r,i)=>`<button class='nav ${state.route===i?'on':''}' data-a='route' data-i='${i}'><span class=ico>⇄</span>${r.name}<span style='margin-inline-start:auto' class=chip>${r.students} طالب</span></button>`).join('')}</div><div class=card><h3>التفاصيل</h3>${route()}</div></div>`;
 if(state.role==='attendant')return `${head('مشرفة الباص','الاستلام والتوثيق',t('الطلاب',db.pickup.length,'اليوم')+t('المرفقات','صورة','إثبات'))}<div class='card'>${db.pickup.map(p=>`<div class=item><div><b>${p[0]}</b><div class=tiny>${p[1]} • ${p[2]}</div></div><span class='chip ${p[3]==='استلمت'?'ok':'warn'}'>${p[3]}</span></div>`).join('')}</div><div class='card'><div class=stack><button class='btn primary'>تم الاستلام مع تصوير</button><button class='btn soft'>لم يحضر</button></div></div>`;
 if(state.role==='driver')return `${head('السائق','المسار الحي والملاحة',t('المركبة',db.routes[state.route].bus,'نشطة')+t('المحطات',6,'اليوم')+t('الموقع','مشارك','فورًا'))}<div class='grid two'><div class=card><h3>المسار</h3>${route()}</div><div class=card><h3>الملاحة</h3><div class='stack'><div class=chip>GPS live</div><div class=chip>توقفات</div><div class=chip>إشعارات الوصول</div></div></div></div>`;
 if(state.role==='parent')return `${head('ولي الأمر','متابعة الأبناء والتتبع',t('ابن نشط',db.students[state.child].n,'قابل للتبديل')+t('الدرجة',db.students[state.child].avg+'%','آخر دورة')+t('الحضور',db.students[state.child].a+'%','العام'))}<div class='grid two'><div class=card><h3>أبنائي</h3>${db.students.map((s,i)=>`<button class='nav ${state.child===i?'on':''}' data-a='child' data-i='${i}'><span class=ico>♙</span>${s.n}<span style='margin-inline-start:auto' class=chip>${s.c}</span></button>`).join('')}</div><div class=card><h3>الملخص</h3>${info(db.students[state.child])}<div class='item'><span>التتبع</span><span class='chip ok'>نشط</span></div><div class='item'><span>الرقابة الأبوية</span><span class='chip warn'>سياسة محفوظة</span></div></div></div>`;
 return `${head('لوحة المدرسة','تجربة مبدئية لكل الأدوار',t('الطلاب',1248,'قيد العام')+t('المعلمون',86,'نشطون')+t('الحضور اليوم',94.2,'%'))}<div class='grid two'><div class=card><h3>بطاقات سريعة</h3><div class='grid two'><button class='btn' data-a='nav' data-p='students'>الطلاب</button><button class='btn' data-a='nav' data-p='transport'>النقل</button><button class='btn' data-a='nav' data-p='grades'>الدرجات</button><button class='btn' data-a='nav' data-p='settings'>الإعدادات</button></div></div><div class=card><h3>الملاحظات</h3><div class='item'><span>الواجهة منفصلة لكل دور</span><span class=chip ok>نعم</span></div><div class='item'><span>النقل والرقابة الأبوية</span><span class=chip warn>مبدئي</span></div></div></div>`}
function info(s){return `<div class=item><span>الاسم</span><b>${s.n}</b></div><div class=item><span>الفصل</span><b>${s.c}</b></div><div class=item><span>ولي الأمر</span><b>${s.p}</b></div><div class=item><span>آخر تقرير</span><b>${s.r}</b></div>`}
function students(){return `${head('الطلاب','ملفات الطلاب والسجلات',t('عدد الطلاب',db.students.length,'عرض تجريبي'))}<div class='grid two'><div class=card>${db.students.map((s,i)=>`<button class='nav ${state.child===i?'on':''}' data-a='child' data-i='${i}'><span class=ico>♙</span>${s.n}<span style='margin-inline-start:auto' class=chip>${s.c}</span></button>`).join('')}</div><div class=card>${info(db.students[state.child])}<div class=stack style='margin-top:12px'><button class='btn primary'>فتح الملف</button><button class='btn soft'>إرسال ملاحظة</button></div></div></div>`}
function grades(){const s=db.students[state.child];return `${head('الدرجات','عرض النتائج والتبديل بين الأبناء',t('المعدل',s.avg+'%','الحالي'))}<div class='card'>${b('الرياضيات',90)}${b('العلوم',88)}${b('العربية',93)}</div>`}
function attendance(){return `${head('الحضور','قوائم الحضور اليومية',t('حاضر',96,'%')+t('متأخر',4,'%'))}<div class='card'><table class=table><thead><tr><th>الطالب</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${db.students.map(s=>`<tr><td>${s.n}</td><td><span class=chip ok>حاضر</span></td><td><button class='btn soft'>حفظ</button></td></tr>`).join('')}</tbody></table></div>`}
function route(){const r=db.routes[state.route];return `<div class='item'><span>المسار</span><b>${r.name}</b></div><div class='item'><span>السائق</span><b>${r.driver}</b></div><div class='item'><span>المشرفة</span><b>${r.attendant}</b></div><div class='item'><span>المركبة</span><b>${r.bus}</b></div><div class='item'><span>الحالة</span><span class='chip ${r.status==='نشط'?'ok':'warn'}'>${r.status}</span></div>`}
function tracking(){const s=db.students[state.child];return `${head('التتبع','موقع الرحلة وموقع الطالب',t('الطالب',s.n,'مربوط بالرحلة'))}<div class='grid two'><div class=card><h3>الحالة الحالية</h3><div class='item'><span>آخر تحديث</span><b>06:58</b></div><div class='item'><span>الباص</span><b>${db.routes[state.route].name}</b></div><div class='item'><span>الموقع</span><span class=chip ok>حي</span></div></div><div class=card><h3>الخريطة</h3><div class='item'><span>التقدم نحو المدرسة</span><b>72%</b></div><div class=chip>GPS foreground</div></div></div>`}
function device(){return `${head('الرقابة الأبوية','سياسات الجهاز والأوامر المعلقة',t('الأبناء',db.students.length,'مرتبطون'))}<div class='grid two'><div class=card>${db.students.map((s,i)=>`<div class=item><div><b>${s.n}</b><div class=tiny>Study Mode • 2h/اليوم</div></div><span class='chip ${i===0?'warn':'ok'}'>${i===0?'مزامنة':'مطبقة'}</span></div>`).join('')}</div><div class=card><div class=stack><button class='btn primary'>قفل الجهاز</button><button class='btn soft'>فتح الجهاز</button><button class='btn soft'>مزامنة السياسة</button></div><div class='tiny' style='margin-top:10px'>هذا إصدار policy/queue فقط، وليس enforcement native.</div></div></div>`}
function production(){return `${head('Phase 9','الإقفال قبل أي نشر',t('الحالة','مفتوحة','')+t('Phase 10','لاحقًا','Android / iOS'))}<div class='grid two'><div class=card><h3>قائمة الإقفال</h3>${['RLS','build/typecheck','Backup/Restore','Monitoring','Role acceptance'].map(x=>`<div class=item><span>${x}</span><span class=chip warn>مفتوح</span></div>`).join('')}</div><div class=card><h3>الخطة</h3><div class='stack'><button class='btn primary'>ابدأ الاختبار</button><button class='btn soft'>راجع النشر</button></div></div></div>`}
function audit(){return `${head('التدقيق','سجل الإجراءات الحساسة',t('الأحداث',3,'اليوم'))}<div class='card'><div class=item><span>تغيير دور مستخدم</span><span class=tiny>منذ 5 دقائق</span></div><div class=item><span>حفظ سياسة نقل</span><span class=tiny>منذ 17 دقيقة</span></div><div class=item><span>إرسال أمر قفل</span><span class=tiny>منذ 21 دقيقة</span></div></div>`}
function settings(){return `${head('الإعدادات','المظهر والحساب',t('الثيم',state.theme,'current'))}<div class='grid two'><div class=card><div class='stack'>${['light','dark','black','system'].map(k=>`<button class='btn ${state.theme===k?'primary':'soft'}' data-a='theme' data-v='${k}'>${k}</button>`).join('')}</div></div><div class=card><div class=item><span>الحساب</span><b>Ahmed Ali</b></div><div class=item><span>البريد</span><b>ahmed@example.com</b></div></div></div>`}
function messages(){return `${head('الرسائل','محادثات بسيطة',t('رسائل',2,'مفتوحة'))}<div class='grid two'><div class=card><div class='item'><span>أ. سارة — رياضيات</span><span class=chip ok>نشط</span></div><div class='item'><span>مجموعة 5A</span><span class=chip warn>جديد</span></div></div><div class=card><div class='item'><span>الطالب</span><b>أستاذة هل يمكن مراجعة السؤال الثاني؟</b></div><div class='item'><span>المدرس</span><b>أكيد، بعد الحصة مباشرة.</b></div></div></div>`}
function myclasses(){return `${head('فصولي','صفوفي وطلابي',t('الفصول',3,''))}<div class='card'>${db.students.map(s=>`<div class=item><span>${s.c} • ${s.n}</span><span class=chip>${s.avg}%</span></div>`).join('')}</div>`}
function behavior(){return `${head('التقارير السلوكية','حالات تحتاج متابعة',t('مراجعة',2,''))}<div class='card'><div class=item><span>${db.students[0].n}</span><span class=chip warn>تنبيه واحد</span></div><div class=item><span>${db.students[2].n}</span><span class=chip warn>تأخر واجب</span></div></div>`}
function page(){return ({dashboard,students,attendance,grades,transport:dashboard,myclasses,assignments:messages,messages,behavior,routes:dashboard,attendant:dashboard,driver:dashboard,tracking,children:dashboard,device,production,audit,settings})[state.page]();}
function shell(){return `<div class=app><aside class=side><div class=brand><div class=mark>MS</div><div><b>My School</b><div class=tiny>موديولز مستقلة</div></div></div><div class=box><div class=tiny>الدور</div><select id=role class=select>${Object.entries(roles).map(([k,v])=>`<option value='${k}' ${state.role===k?'selected':''}>${v}</option>`).join('')}</select></div>${nav()}</aside><main class=main>${header()}<section class=content>${page()}</section><div class=foot>My School • Modular Phase 9 Prototype • بيانات افتراضية فقط</div></main></div>`}
function render(){app.innerHTML=shell();document.querySelector('#role').onchange=e=>{state.role=e.target.value;state.page='dashboard';render()};document.querySelectorAll('[data-a="nav"]').forEach(b=>b.onclick=()=>{state.page=b.dataset.p;render()});document.querySelectorAll('[data-a="child"]').forEach(b=>b.onclick=()=>{state.child=+b.dataset.i;render()});document.querySelectorAll('[data-a="route"]').forEach(b=>b.onclick=()=>{state.route=+b.dataset.i;render()});document.querySelectorAll('[data-a="theme"]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=state.theme=b.dataset.v;render()})}
render();
</script></body></html>
